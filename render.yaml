databases:
  - name: college-erp-db
    databaseName: college_erp
    user: college_erp_user
    plan: free

services:
  - type: web
    name: college-erp
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: college-erp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: ALLOW_SEED
        value: "true"
